# toeb.github.io: Hugo site, theme "workshop" (themes/workshop). Build: hugo --minify
baseURL = "https://toeb.github.io/"
locale = "en-us"
title = "toeb / notes"
theme = "workshop"
enableRobotsTXT = true

[pagination]
  pagerSize = 1000

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = "github-dark"
    noClasses = true

[taxonomies]
  tag = "tags"
  category = "categories"

[params]
  author = "Tobias Becker"
  role = "software engineer"
  description = "Tobias Becker's notes on software engineering: build systems, C++, and making AI agents reliable with deterministic harnesses."
  [[params.links]]
    name = "GitHub"
    url = "https://github.com/toeb"
  [[params.links]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/tobias-becker-a64475a3/"
  [[params.links]]
    name = "Stack Overflow"
    url = "https://stackoverflow.com/users/1229468/toeb"

[menus]
  [[menus.main]]
    name = "Index"
    url = "/"
    weight = 1
  [[menus.main]]
    name = "Topics"
    url = "/tags/"
    weight = 2
  [[menus.main]]
    name = "GitHub"
    url = "https://github.com/toeb"
    weight = 3
  [[menus.main]]
    name = "RSS"
    url = "/index.xml"
    weight = 4
