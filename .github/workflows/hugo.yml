# Build the blog with Hugo and deploy it to GitHub Pages on every push to devel.
name: blog
on:
  push:
    branches: [devel]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  HUGO_VERSION: 0.167.0
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo ${{ env.HUGO_VERSION }} (checksum verified)
        run: |
          f=hugo_${HUGO_VERSION}_linux-amd64.tar.gz
          curl -sSLO https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/$f
          curl -sSL https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt | grep " $f" | sha256sum -c -
          tar xzf $f hugo && sudo mv hugo /usr/local/bin/
      - run: hugo --minify --destination public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
